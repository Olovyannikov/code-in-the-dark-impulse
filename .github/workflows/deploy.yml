name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npx vitest run

      - run: npx eslint .

      - run: npx steiger src

      - run: npm run build
        env:
          GITHUB_PAGES: 'true'

      # Редактор и бандлы раундов едут рядом с приложением:
      # /            — инструмент оператора
      # /editor/      — оглавление раундов
      # /editor/round-01/ … — редактор с макетом раунда
      - name: Собрать бандлы раундов
        working-directory: .
        run: ./editor/build-all.sh web/dist/editor

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
