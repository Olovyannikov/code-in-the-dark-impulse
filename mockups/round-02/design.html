<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Импульс 2026 — обложка</title>
<style>
  @font-face {
    font-family: 'ALS Hauss';
    src: url('assets/fonts/ALSHauss-Regular.woff2') format('woff2');
    font-weight: 400; font-display: block;
  }
  @font-face {
    font-family: 'ALS Hauss';
    src: url('assets/fonts/ALSHauss-Medium.woff2') format('woff2');
    font-weight: 500; font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #000; color: #fff;
    font-family: 'ALS Hauss', Helvetica, Arial, sans-serif;
    font-weight: 400;
  }

  body { display: flex; flex-direction: column; justify-content: space-between; padding: 70px 80px; }
  .kicker { font-size: 28px; font-weight: 500; letter-spacing: -0.02em; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .huge { font-size: 420px; font-weight: 500; line-height: 0.8; letter-spacing: -0.05em; color: #1DAFF7; }
  .under { font-size: 44px; font-weight: 500; letter-spacing: -0.02em; margin-top: 24px; }
  footer { display: flex; justify-content: space-between; font-size: 22px; color: #AEB1B7; }
</style>
</head>
<body>

  <div class="kicker">Code in the Dark</div>
  <main>
    <div class="huge">16</div>
    <div class="under">участников в темноте</div>
  </main>
  <footer>
    <span>Импульс 2026</span>
    <span>19 ноября</span>
  </footer>
</body>
</html>
