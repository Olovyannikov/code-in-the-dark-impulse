<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Импульс 2026 — круг</title>
<style>
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Regular.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Medium.woff2') format('woff2'); font-weight:500; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1920px; height:1080px; overflow:hidden; position:relative;
    background:#000; color:#fff;
    font-family:'ALS Hauss', Helvetica, Arial, sans-serif; font-weight:400;
  }
  /* Сквозные шапка и подвал — одинаковые во всех раундах */
  .top, .bot { position:absolute; left:64px; right:64px; display:flex; justify-content:space-between; align-items:center; z-index:5; }
  .top { top:48px; }
  .bot { bottom:48px; font-size:18px; color:#AEB1B7; }
  .brand { font-size:22px; font-weight:500; letter-spacing:-0.02em; }
  .plus { font-size:40px; font-weight:500; color:#1DAFF7; letter-spacing:-0.04em; }
  .nav { display:flex; gap:36px; font-size:18px; color:#AEB1B7; }
  .nav b { color:#1DAFF7; font-weight:500; }

  .circle { position:absolute; top:250px; left:640px; width:560px; height:560px; border-radius:50%; background:#1DAFF7; z-index:1; }
  main { position:absolute; top:360px; left:160px; z-index:3; }
  h1 { font-size:168px; font-weight:500; line-height:0.86; letter-spacing:-0.05em; }
  .sub { margin-top:28px; font-size:26px; color:#AEB1B7; max-width:520px; line-height:1.4; }
  .badge { position:absolute; top:250px; right:220px; z-index:4; transform:rotate(-12deg);
           background:#fff; color:#000; font-size:24px; font-weight:500; padding:14px 26px; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">Code in the Dark</div>
    <div class="nav"><b>Отбор 2</b><span>Отбор 3</span><span>Финал</span></div>
    <div class="plus">+1</div>
  </div>

  <div class="circle"></div>
  <div class="badge">10 минут вслепую</div>
  <main>
    <h1>Ты думал,<br>что знаешь<br>фронтенд</h1>
    <p class="sub">Превью нет. Линеек нет. Есть только то, что ты помнишь.</p>
  </main>
  <div class="bot">
    <span>Импульс 2026</span>
    <span>Отбор 2</span>
    <span>19 ноября</span>
  </div>
</body>
</html>
