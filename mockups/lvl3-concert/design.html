<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Переполнение стека — тур</title>
<style>
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Regular.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Medium.woff2') format('woff2'); font-weight:500; font-display:block; }
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Black.woff2') format('woff2'); font-weight:900; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1920px; height:1080px; overflow:hidden; position:relative;
    background:url('assets/img/halftone.svg'), url('assets/img/stage.svg') center / cover;
    color:#fff; font-family:'ALS Hauss', Helvetica, Arial, sans-serif;
    font-feature-settings:'liga' 0, 'calt' 0;
  }
  .plus { position:absolute; top:44px; right:64px; font-size:40px; font-weight:500; color:#FFE600; }
  .kick { position:absolute; top:56px; left:72px; font-size:26px; font-weight:500; letter-spacing:0.3em; text-transform:uppercase; }
  .tape { position:absolute; left:-100px; right:-100px; top:150px; background:#FFE600; color:#0B0614; transform:rotate(-4deg);
          font-size:40px; font-weight:900; padding:12px 0; white-space:nowrap; letter-spacing:0.05em; }
  h1 { position:absolute; left:64px; top:300px; font-size:212px; font-weight:900; line-height:0.82; letter-spacing:-0.05em; text-transform:uppercase; }
  h1 span { display:block; color:transparent; -webkit-text-stroke:5px #FF2E88; }
  .dates { position:absolute; left:72px; bottom:72px; width:880px; }
  .row { display:flex; gap:32px; align-items:baseline; padding:16px 0; border-top:3px solid #fff; font-size:34px; }
  .row b { width:130px; font-weight:900; color:#FFE600; }
  .row s { color:#8C8399; }
  .row em { margin-left:auto; font-style:normal; font-size:22px; font-weight:500; background:#FF2E88; padding:6px 14px; }
  .ticket { position:absolute; right:110px; bottom:130px; width:640px; height:260px; background:#FFF6E0; color:#0B0614;
            display:flex; transform:rotate(6deg); }
  .ticket .main { flex:1; padding:32px 36px; border-right:4px dashed #0B0614; }
  .ticket .t1 { font-size:22px; font-weight:500; letter-spacing:0.2em; text-transform:uppercase; color:#FF2E88; }
  .ticket .t2 { margin-top:12px; font-size:54px; font-weight:900; line-height:0.95; letter-spacing:-0.03em; }
  .ticket .t3 { margin-top:16px; font-size:22px; }
  .ticket .stub { width:140px; display:flex; align-items:center; justify-content:center; }
  .ticket img { width:80px; height:220px; }
</style>
</head>
<body>
  <div class="kick">Мировой тур 2026</div>
  <div class="plus">+1</div>
  <div class="tape">МИРОВОЙ ТУР ★ ПЕРЕПОЛНЕНИЕ СТЕКА ★ МИРОВОЙ ТУР ★ ПЕРЕПОЛНЕНИЕ СТЕКА ★ МИРОВОЙ ТУР</div>
  <h1>Переполнение<span>стека</span></h1>
  <div class="dates">
    <div class="row"><b>19.11</b><span>Импульс, главная сцена</span><em>sold out</em></div>
    <div class="row"><b>ПТ</b><s>Продакшен, вечерний деплой</s><em>отменён</em></div>
    <div class="row"><b>∞</b><span>localhost:3000</span><em>всегда</em></div>
  </div>
  <div class="ticket">
    <div class="main">
      <div class="t1">Входной билет</div>
      <div class="t2">Танцпол<br>у сервера</div>
      <div class="t3">Цена: один зелёный коммит</div>
    </div>
    <div class="stub"><img src="assets/img/barcode.svg" alt=""></div>
  </div>
</body>
</html>
