<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Импульс 2026</title>
<style>
  @font-face {
    font-family: 'ALS Hauss';
    src: url('assets/fonts/ALSHauss-Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: block;
  }

  @font-face {
    font-family: 'ALS Hauss';
    src: url('assets/fonts/ALSHauss-Medium.woff2') format('woff2');
    font-weight: 500;
    font-display: block;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    background: #000;
    color: #fff;
    font-family: 'ALS Hauss', Helvetica, Arial, sans-serif;
    font-weight: 400;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 72px;
    overflow: hidden;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .kicker {
    font-size: 26px;
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }

  .logo {
    font-size: 54px;
    font-weight: 500;
    color: #1DAFF7;
    letter-spacing: -0.04em;
  }

  h1 {
    font-size: 210px;
    font-weight: 500;
    line-height: 0.85;
    letter-spacing: -0.04em;
  }

  h1 em {
    font-style: normal;
    color: #1DAFF7;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
  }

  footer {
    display: flex;
    gap: 120px;
    border-top: 6px solid #1DAFF7;
    padding-top: 40px;
  }

  .meta-label {
    font-size: 20px;
    color: #AEB1B7;
    margin-bottom: 10px;
  }

  .meta-value {
    font-size: 34px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
</style>
</head>
<body>

  <header>
    <p class="kicker">Визуальная концепция<br>мероприятия</p>
    <div class="logo">+1</div>
  </header>

  <main>
    <h1>Импульс<br><em>2026</em></h1>
  </main>

  <footer>
    <div>
      <p class="meta-label">Дата</p>
      <p class="meta-value">19 ноября</p>
    </div>
    <div>
      <p class="meta-label">Формат</p>
      <p class="meta-value">Code in the Dark</p>
    </div>
    <div>
      <p class="meta-label">Участников</p>
      <p class="meta-value">16</p>
    </div>
  </footer>

</body>
</html>
