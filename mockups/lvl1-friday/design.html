<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Не деплой в пятницу</title>
<style>
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Regular.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Medium.woff2') format('woff2'); font-weight:500; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1920px; height:1080px; overflow:hidden;
    background:#FFD21F; color:#111;
    font-family:'ALS Hauss', Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column;
  }
  .band { height:96px; background:url('assets/img/stripes.svg'); }
  main { flex:1; display:flex; align-items:center; justify-content:space-between; padding:0 120px; }
  .label { font-size:28px; font-weight:500; text-transform:uppercase; letter-spacing:0.08em; }
  h1 { margin-top:24px; font-size:190px; font-weight:500; line-height:0.86; letter-spacing:-0.05em; }
  p { margin-top:40px; font-size:34px; max-width:880px; line-height:1.2; }
  .warn { width:460px; height:400px; }
</style>
</head>
<body>
  <div class="band"></div>
  <main>
    <div>
      <div class="label">Предупреждение №1</div>
      <h1>Не деплой<br>в пятницу</h1>
      <p>Выходные — не время для хотфиксов. Отдел эксплуатации заранее благодарит.</p>
    </div>
    <img class="warn" src="assets/img/warning.svg" alt="">
  </main>
  <div class="band"></div>
</body>
</html>
