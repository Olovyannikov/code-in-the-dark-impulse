<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Импульс 2026 — цитата</title>
<style>
  @font-face {
    font-family: 'ALS Hauss';
    src: url('assets/fonts/ALSHauss-Regular.woff2') format('woff2');
    font-weight: 400; font-display: block;
  }
  @font-face {
    font-family: 'ALS Hauss';
    src: url('assets/fonts/ALSHauss-Medium.woff2') format('woff2');
    font-weight: 500; font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #000; color: #fff;
    font-family: 'ALS Hauss', Helvetica, Arial, sans-serif;
    font-weight: 400;
  }

  body { display: flex; flex-direction: column; justify-content: center; padding: 80px 120px; }
  .quote-mark { font-size: 300px; font-weight: 500; line-height: 0.6; color: #1DAFF7; }
  blockquote { font-size: 76px; font-weight: 500; line-height: 1.05; letter-spacing: -0.03em; max-width: 1400px; margin-top: 24px; }
  .sign { margin-top: 56px; display: flex; align-items: center; gap: 24px; }
  .rule { width: 120px; height: 3px; background: #1DAFF7; }
  .who { font-size: 26px; color: #AEB1B7; }
</style>
</head>
<body>

  <div class="quote-mark">&laquo;</div>
  <blockquote>Ты думал, что знаешь фронтенд.<br>Проверим это без превью.</blockquote>
  <div class="sign">
    <div class="rule"></div>
    <div class="who">Code in the Dark &middot; Импульс 2026</div>
  </div>
</body>
</html>
