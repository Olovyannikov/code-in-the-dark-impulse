<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ищем единорога</title>
<style>
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Regular.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Medium.woff2') format('woff2'); font-weight:500; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1920px; height:1080px; overflow:hidden; position:relative;
    background:#F4F1EA url('assets/img/grid.svg');
    color:#1E1E2E; font-family:'ALS Hauss', Helvetica, Arial, sans-serif;
  }
  header { position:absolute; top:48px; left:96px; right:96px; display:flex; align-items:center; justify-content:space-between; z-index:3; }
  .logo { font-size:28px; font-weight:500; }
  nav { display:flex; gap:12px; }
  nav span { border:3px solid #1E1E2E; border-radius:40px; padding:10px 26px; font-size:22px; font-weight:500; background:#F4F1EA; }
  nav span.on { background:#1E1E2E; color:#fff; }
  .circle { position:absolute; right:-160px; top:160px; width:980px; height:980px; border-radius:50%; background:#7B5CFF; }
  .unicorn { position:absolute; right:140px; bottom:0; width:640px; height:640px; }
  main { position:absolute; top:200px; left:96px; width:960px; }
  .tag { display:inline-block; background:#FFD21F; padding:10px 22px; font-size:24px; font-weight:500; border:3px solid #1E1E2E; }
  h1 { margin-top:32px; font-size:124px; font-weight:500; line-height:0.9; letter-spacing:-0.05em; }
  h1 span { color:#7B5CFF; }
  ul { list-style:none; margin-top:48px; }
  li { display:flex; align-items:center; gap:20px; font-size:32px; margin-bottom:22px; }
  li img { width:40px; height:40px; }
  .sticker { position:absolute; left:820px; top:760px; transform:rotate(8deg);
             background:#FF5FA2; color:#fff; border:4px solid #1E1E2E; padding:22px 30px; font-size:28px; font-weight:500; line-height:1.15; z-index:2; }
</style>
</head>
<body>
  <header>
    <div class="logo">ООО «Стартап» <span style="color:#7B5CFF">+1</span></div>
    <nav><span>О нас</span><span class="on">Вакансии</span><span>Печеньки</span></nav>
  </header>
  <div class="circle"></div>
  <img class="unicorn" src="assets/img/unicorn.svg" alt="">
  <main>
    <div class="tag">Вакансия · Junior</div>
    <h1>Ищем джуна<br><span>с опытом 10 лет</span></h1>
    <ul>
      <li><img src="assets/img/check.svg" alt="">Знание фреймворка, которому 2 года</li>
      <li><img src="assets/img/check.svg" alt="">Все языки, включая эльфийский</li>
      <li><img src="assets/img/check.svg" alt="">Стрессоустойчивость уровня «прод упал»</li>
      <li><img src="assets/img/check.svg" alt="">Умение делать вид, что прочитал ТЗ</li>
    </ul>
  </main>
  <div class="sticker">Зарплата:<br>опыт и печеньки</div>
</body>
</html>
