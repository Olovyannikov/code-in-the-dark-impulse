<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Импульс 2026 — стикер</title>
<style>
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Regular.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Medium.woff2') format('woff2'); font-weight:500; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1920px; height:1080px; overflow:hidden; position:relative;
    background:#000; color:#fff;
    font-family:'ALS Hauss', Helvetica, Arial, sans-serif; font-weight:400;
  }
  /* Сквозные шапка и подвал — одинаковые во всех раундах */
  .top, .bot { position:absolute; left:64px; right:64px; display:flex; justify-content:space-between; align-items:center; z-index:5; }
  .top { top:48px; }
  .bot { bottom:48px; font-size:18px; color:#AEB1B7; }
  .brand { font-size:22px; font-weight:500; letter-spacing:-0.02em; }
  .plus { font-size:40px; font-weight:500; color:#1DAFF7; letter-spacing:-0.04em; }
  .nav { display:flex; gap:36px; font-size:18px; color:#AEB1B7; }
  .nav b { color:#1DAFF7; font-weight:500; }

  .stripe { position:absolute; top:0; left:980px; width:220px; height:1080px; background:#111; z-index:0; }
  .grid { position:absolute; top:240px; left:64px; right:64px; display:grid; grid-template-columns:1fr 1fr; gap:120px; z-index:2; }
  h1 { font-size:116px; font-weight:500; line-height:0.86; letter-spacing:-0.04em; }
  h1 em { font-style:normal; color:#1DAFF7; }
  ul { list-style:none; margin-top:12px; }
  li { padding:22px 0; border-bottom:1px solid #333; font-size:28px; font-weight:500; display:flex; gap:24px; }
  li span { color:#1DAFF7; }
  .sticker { position:absolute; top:520px; left:880px; z-index:6; transform:rotate(8deg);
             background:#1DAFF7; color:#000; padding:28px 34px; width:260px; }
  .sticker .n { font-size:64px; font-weight:500; line-height:1; letter-spacing:-0.04em; }
  .sticker .t { font-size:18px; margin-top:8px; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">Code in the Dark</div>
    <div class="nav"><b>Отбор 3</b><span>Отбор 4</span><span>Финал</span></div>
    <div class="plus">+1</div>
  </div>

  <div class="stripe"></div>
  <div class="grid">
    <div><h1>Правила<br><em>простые</em></h1></div>
    <ul>
      <li><span>01</span>Никаких превью</li>
      <li><span>02</span>Не выходить из редактора</li>
      <li><span>03</span>Никаких линеек</li>
      <li><span>04</span>Руки от клавиатуры</li>
    </ul>
  </div>
  <div class="sticker"><div class="n">16</div><div class="t">участников</div></div>
  <div class="bot">
    <span>Импульс 2026</span>
    <span>Отбор 3</span>
    <span>19 ноября</span>
  </div>
</body>
</html>
