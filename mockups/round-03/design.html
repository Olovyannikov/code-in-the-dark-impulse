<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Импульс 2026 — правила</title>
<style>
  @font-face {
    font-family: 'ALS Hauss';
    src: url('assets/fonts/ALSHauss-Regular.woff2') format('woff2');
    font-weight: 400; font-display: block;
  }
  @font-face {
    font-family: 'ALS Hauss';
    src: url('assets/fonts/ALSHauss-Medium.woff2') format('woff2');
    font-weight: 500; font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #000; color: #fff;
    font-family: 'ALS Hauss', Helvetica, Arial, sans-serif;
    font-weight: 400;
  }

  body { display: grid; grid-template-columns: 40% 60%; align-items: center; padding: 80px; column-gap: 80px; }
  h1 { font-size: 110px; font-weight: 500; line-height: 0.88; letter-spacing: -0.04em; }
  h1 span { color: #1DAFF7; }
  .lead { margin-top: 32px; font-size: 24px; color: #AEB1B7; max-width: 440px; line-height: 1.4; }
  ol { list-style: none; }
  li { display: flex; gap: 32px; padding: 28px 0; border-top: 2px solid #1DAFF7; }
  li:last-child { border-bottom: 2px solid #1DAFF7; }
  .num { font-size: 32px; font-weight: 500; color: #1DAFF7; min-width: 60px; }
  .text { font-size: 32px; font-weight: 500; letter-spacing: -0.02em; }
</style>
</head>
<body>

  <div>
    <h1>Четыре<br><span>правила</span></h1>
    <p class="lead">Их знает весь зал. Нарушение замечают зрители, а не судьи.</p>
  </div>
  <ol>
    <li><span class="num">01</span><span class="text">Никаких превью</span></li>
    <li><span class="num">02</span><span class="text">Не выходить из редактора</span></li>
    <li><span class="num">03</span><span class="text">Никаких линеек и DevTools</span></li>
    <li><span class="num">04</span><span class="text">Время вышло — руки от клавиатуры</span></li>
  </ol>
</body>
</html>
