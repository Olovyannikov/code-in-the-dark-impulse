<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сертификат</title>
<style>
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Regular.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Medium.woff2') format('woff2'); font-weight:500; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1920px; height:1080px; overflow:hidden;
    background:#16224A url('assets/img/wave.svg');
    font-family:'ALS Hauss', Helvetica, Arial, sans-serif; color:#16224A;
    display:flex; align-items:center; justify-content:center;
  }
  .card { position:relative; width:1440px; height:820px; background:#FFFDF6; padding:24px; }
  .inner { height:100%; border:6px double #C8A23A; text-align:center; padding-top:90px; }
  .label { font-size:26px; font-weight:500; letter-spacing:0.3em; text-transform:uppercase; color:#C8A23A; }
  h1 { margin-top:28px; font-size:120px; font-weight:500; letter-spacing:-0.04em; line-height:1; }
  p { margin-top:36px; font-size:32px; }
  .big { margin-top:20px; font-size:76px; font-weight:500; letter-spacing:-0.03em; color:#C8A23A; }
  .signs { position:absolute; left:120px; right:420px; bottom:110px; display:flex; justify-content:space-between; }
  .sign { width:340px; border-top:3px solid #16224A; padding-top:14px; font-size:22px; text-align:left; }
  .seal { position:absolute; right:-60px; bottom:-70px; width:300px; height:300px; transform:rotate(-12deg); }
</style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <div class="label">Импульс 2026</div>
      <h1>Сертификат</h1>
      <p>Настоящим подтверждается, что этот код</p>
      <div class="big">работает на моей машине</div>
    </div>
    <div class="signs">
      <div class="sign">Автор кода</div>
      <div class="sign">Тимлид (не проверял)</div>
    </div>
    <img class="seal" src="assets/img/seal.svg" alt="">
  </div>
</body>
</html>
