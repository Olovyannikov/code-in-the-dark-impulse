<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Импульс VI — анонс</title>
<style>
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Regular.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Medium.woff2') format('woff2'); font-weight:500; font-display:block; }
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Black.woff2') format('woff2'); font-weight:900; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; overflow:hidden; position:relative;
         background:#000; color:#fff; font-family:'ALS Hauss', Helvetica, Arial, sans-serif; }

  .sky { position:absolute; inset:0; z-index:0;
         background:
           radial-gradient(120% 90% at 50% 112%, #FFB038 0%, #FF5EA8 34%, #B026C9 58%, #2A0B45 80%, #000 100%); }
  .sun { position:absolute; left:50%; bottom:-240px; transform:translateX(-50%);
         width:900px; height:900px; border-radius:50%; z-index:1;
         background:radial-gradient(circle, #FFD36E 0%, #FF7A3D 45%, rgba(255,94,168,0) 70%); opacity:.9; }
  .grid { position:absolute; left:0; right:0; bottom:0; height:300px; z-index:2;
          background:
            repeating-linear-gradient(to right, rgba(255,94,168,.55) 0 2px, transparent 2px 120px),
            repeating-linear-gradient(to bottom, rgba(255,94,168,.55) 0 2px, transparent 2px 60px); }
  .top { position:absolute; top:44px; left:64px; right:64px; z-index:6; display:flex;
         justify-content:space-between; font-size:18px; letter-spacing:.22em; text-transform:uppercase; opacity:.85; }
  main { position:absolute; top:300px; left:0; right:0; text-align:center; z-index:5; }
  .kicker { font-size:26px; letter-spacing:.42em; text-transform:uppercase; opacity:.85; }
  h1 { margin-top:26px; font-weight:900; font-size:300px; line-height:0.82; letter-spacing:-0.045em;
       background:linear-gradient(180deg, #FFE8A3 0%, #FF9A3C 42%, #FF4FA3 100%);
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  .date { position:absolute; bottom:210px; left:0; right:0; text-align:center; z-index:6;
          font-size:52px; font-weight:500; letter-spacing:.18em; }
  .plate { position:absolute; bottom:120px; left:50%; transform:translateX(-50%) rotate(-2deg); z-index:7;
           background:#fff; color:#111; padding:12px 26px; font-size:20px; font-weight:500; letter-spacing:.1em; }
</style>
</head>
<body>

  <div class="sky"></div><div class="sun"></div><div class="grid"></div>
  <div class="top"><span>Импульс</span><span>Code in the Dark</span><span>+1</span></div>
  <main>
    <div class="kicker">Скоро</div>
    <h1>ИМПУЛЬС VI</h1>
  </main>
  <div class="date">19 . 11 . 2026</div>
  <div class="plate">БЕЗ ПРЕВЬЮ · БЕЗ ЛИНЕЕК</div>
</body>
</html>
