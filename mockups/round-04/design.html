<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Импульс 2026 — билет</title>
<style>
  @font-face {
    font-family: 'ALS Hauss';
    src: url('assets/fonts/ALSHauss-Regular.woff2') format('woff2');
    font-weight: 400; font-display: block;
  }
  @font-face {
    font-family: 'ALS Hauss';
    src: url('assets/fonts/ALSHauss-Medium.woff2') format('woff2');
    font-weight: 500; font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #000; color: #fff;
    font-family: 'ALS Hauss', Helvetica, Arial, sans-serif;
    font-weight: 400;
  }

  body { display: flex; align-items: center; justify-content: center; }
  .ticket { width: 1100px; background: #111; }
  .top { background: #1DAFF7; color: #000; padding: 56px 64px; display: flex; justify-content: space-between; align-items: flex-end; }
  .top h1 { font-size: 92px; font-weight: 500; line-height: 0.9; letter-spacing: -0.04em; }
  .top .plus { font-size: 64px; font-weight: 500; letter-spacing: -0.04em; }
  .bottom { padding: 56px 64px; display: flex; gap: 90px; }
  .label { font-size: 20px; color: #AEB1B7; margin-bottom: 12px; }
  .value { font-size: 38px; font-weight: 500; letter-spacing: -0.02em; }
  .strip { height: 10px; background: #1DAFF7; }
</style>
</head>
<body>

  <div class="ticket">
    <div class="top">
      <h1>Code in<br>the Dark</h1>
      <div class="plus">+1</div>
    </div>
    <div class="bottom">
      <div><div class="label">Дата</div><div class="value">19 ноября</div></div>
      <div><div class="label">Раунд</div><div class="value">Отбор 4</div></div>
      <div><div class="label">Время</div><div class="value">10 минут</div></div>
    </div>
    <div class="strip"></div>
  </div>
</body>
</html>
