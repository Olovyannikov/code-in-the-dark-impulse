<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Импульс 2026 — вылет за край</title>
<style>
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Regular.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'ALS Hauss'; src:url('assets/fonts/ALSHauss-Medium.woff2') format('woff2'); font-weight:500; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1920px; height:1080px; overflow:hidden; position:relative;
    background:#000; color:#fff;
    font-family:'ALS Hauss', Helvetica, Arial, sans-serif; font-weight:400;
  }
  /* Сквозные шапка и подвал — одинаковые во всех раундах */
  .top, .bot { position:absolute; left:64px; right:64px; display:flex; justify-content:space-between; align-items:center; z-index:5; }
  .top { top:48px; }
  .bot { bottom:48px; font-size:18px; color:#AEB1B7; }
  .brand { font-size:22px; font-weight:500; letter-spacing:-0.02em; }
  .plus { font-size:40px; font-weight:500; color:#1DAFF7; letter-spacing:-0.04em; }
  .nav { display:flex; gap:36px; font-size:18px; color:#AEB1B7; }
  .nav b { color:#1DAFF7; font-weight:500; }

  .ghost { position:absolute; top:120px; left:-60px; font-size:620px; font-weight:500;
           line-height:0.8; letter-spacing:-0.06em; color:#111; z-index:0; }
  .card { position:absolute; top:330px; left:420px; width:1700px; background:#1DAFF7; color:#000; z-index:3;
          padding:56px 64px; display:flex; gap:120px; align-items:flex-end; }
  .card h1 { font-size:104px; font-weight:500; line-height:0.88; letter-spacing:-0.04em; }
  .card .meta { padding-bottom:10px; }
  .card .meta div { font-size:28px; font-weight:500; }
  .card .meta span { font-size:18px; opacity:.6; }
  .note { position:absolute; top:700px; left:420px; width:620px; z-index:3;
          font-size:24px; color:#AEB1B7; line-height:1.5; }
  .dot { position:absolute; top:640px; left:1240px; width:180px; height:180px; border-radius:50%;
         border:3px solid #1DAFF7; z-index:2; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">Code in the Dark</div>
    <div class="nav"><b>Отбор 4</b><span>Финал</span><span>Итоги</span></div>
    <div class="plus">+1</div>
  </div>

  <div class="ghost">04</div>
  <div class="card">
    <h1>Последний<br>отбор</h1>
    <div class="meta"><div>10 минут</div><span>на раунд</span></div>
  </div>
  <div class="dot"></div>
  <p class="note">Победитель садится в финал. Остальные идут в зал и голосуют — именно они решают, кто выиграет вечер.</p>
  <div class="bot">
    <span>Импульс 2026</span>
    <span>Отбор 4</span>
    <span>19 ноября</span>
  </div>
</body>
</html>
